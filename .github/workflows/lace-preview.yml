name: Test released Lace on Preview in an isolated runner

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Official package probe, or fresh-wallet funded Preview lifecycle
        type: choice
        options: [probe, setup-and-accept]
        default: probe
      funding:
        description: Lace self-registration, or SDK designation to Lace's public DUST address
        type: choice
        options: [self-registration, sdk-dust-designation]
        default: self-registration

permissions:
  contents: read

concurrency:
  group: reviewlab-lace-preview
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'IBKR-BouncyBot/Midnight-ReviewLab' && github.ref == 'refs/heads/main'
    name: Run unmodified official Lace 2.5.1
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      REVIEWLAB_CI_FUNDING_MODE: ${{ inputs.funding }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install committed browser dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix devnet --ignore-scripts
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the Store package and observe real initial UI
        if: inputs.phase == 'probe'
        # No wallet is created in this first checkpoint. No seed, password,
        # browser profile, screenshot, trace or network payload is retained.
        run: xvfb-run --auto-servernum node devnet/lace-ci-preview.mjs probe
      - name: Create a fresh ephemeral Preview wallet and select internal WASM
        if: inputs.phase == 'setup-and-accept'
        run: xvfb-run --auto-servernum node devnet/lace-ci-preview.mjs setup
      - name: Publish only the public Preview funding request
        if: inputs.phase == 'setup-and-accept'
        uses: actions/upload-artifact@v4
        with:
          name: reviewlab-lace-funding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/lace-ci/funding-request.json
            artifacts/lace-ci/setup-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Resume encrypted wallet, await test funding and prove through real Lace
        if: inputs.phase == 'setup-and-accept'
        # The previous artifact is available while this bounded wait runs.
        # The operator either sends test NIGHT for Lace registration or uses
        # an external SDK wallet to designate generation to its public DUST
        # address. The funding request explicitly distinguishes those modes.
        # No existing wallet seed or GitHub secret is passed to this job.
        run: xvfb-run --auto-servernum node devnet/lace-ci-preview.mjs acceptance
      - name: Remove the private ephemeral browser profile
        if: always()
        run: node devnet/lace-ci-preview.mjs cleanup
      - name: Retain only sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewlab-lace-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/lace-ci/probe-evidence.json
            artifacts/lace-ci/setup-evidence.json
            artifacts/lace-ci/acceptance-evidence.json
            artifacts/lace-ci/funding-request.json
            artifacts/lace-ci/public-record.json
          if-no-files-found: warn
          retention-days: 14
