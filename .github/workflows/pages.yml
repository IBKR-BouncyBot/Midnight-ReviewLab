name: Test and deploy ReviewLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned Compact compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci-install-midnight.sh
      - name: Install the committed dependency graph
        run: npm ci --ignore-scripts
      - name: Compile the contract and generate proof keys
        run: npm run compile
      - name: Test the generated contract and application boundaries
        run: npm test
      - name: Build the GitHub Pages frontend
        run: npm run build
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Exercise the real browser application
        run: npm run test:browser
      - name: Check the real testnet bundle and wallet failure boundaries
        run: npm run test:network-browser
      - name: Retain the compiled application
        uses: actions/upload-artifact@v4
        with:
          name: reviewlab-static-build
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish tested application
        id: deployment
        uses: actions/deploy-pages@v4
